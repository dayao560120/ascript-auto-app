name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-17-jdk \
          autoconf automake libtool pkg-config \
          libncurses5-dev libncursesw5-dev \
          build-essential libssl-dev libffi-dev \
          wget curl unzip

        pip install --upgrade pip
        pip install buildozer cython

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.cache/pip
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK with verbose logging
      run: |
        # Don't use Chinese mirror for now - use default PyPI
        export ANDROID_SDK_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        echo "Starting Buildozer build..."
        echo "This may take 30-40 minutes for first build."
        
        # Run buildozer with verbose output
        buildozer -v android debug 2>&1 | tee build.log
        
        # Show last 100 lines of build log
        echo "=== Last 100 lines of build log ==="
        tail -n 100 build.log

    - name: Check build output
      if: always()
      run: |
        echo "=== Checking dist directory ==="
        ls -la dist/ || echo "dist directory not found"
        
        echo "=== Finding APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        echo "=== Build log (last 50 lines) ==="
        tail -n 50 build.log || echo "No build log found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ascript-auto-apk
        path: dist/*.apk
        retention-days: 90

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs
        path: build.log
        retention-days: 7
