name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        echo "::group::Installing system dependencies"
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          openjdk-17-jdk \
          autoconf automake libtool pkg-config \
          libncurses5-dev libncursesw5-dev \
          build-essential libssl-dev libffi-dev \
          wget curl unzip git-core \
          > /dev/null 2>&1
        echo "::endgroup::"

        echo "Verifying installations:"
        java -version
        python3 --version
        pip3 --version

    - name: Install Python packages
      run: |
        echo "Installing Buildozer and Cython..."
        pip install --upgrade pip -q
        pip install buildozer cython -q
        echo "Buildozer version:"
        buildozer --version

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-global-

    - name: Build APK
      id: build
      run: |
        echo "========================================="
        echo "Starting Buildozer APK build"
        echo "========================================="
        echo "Start time: $(date)"
        echo ""

        # Set environment
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export NDK_HOME=$ANDROID_HOME/ndk-bundle

        echo "Environment:"
        echo "  ANDROID_HOME=$ANDROID_HOME"
        echo "  Working directory: $(pwd)"
        echo ""

        # List project files
        echo "Project files:"
        ls -la
        echo ""

        # Show buildozer.spec
        echo "buildozer.spec content:"
        cat buildozer.spec
        echo ""

        # Run buildozer
        echo "========================================="
        echo "Running: buildozer android debug"
        echo "This will take 30-40 minutes for first build..."
        echo "========================================="

        buildozer android debug

        echo ""
        echo "========================================="
        echo "Build completed at: $(date)"
        echo "========================================="

        # Check for APK
        echo ""
        echo "Checking for APK files:"
        if ls dist/*.apk 1> /dev/null 2>&1; then
          echo "SUCCESS: APK file(s) found!"
          ls -lh dist/*.apk
        else
          echo "ERROR: No APK file found in dist/"
          echo "Contents of dist/:"
          ls -la dist/ || echo "dist/ directory does not exist"
          exit 1
        fi

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ascript-auto-apk
        path: dist/*.apk
        retention-days: 90

    - name: Upload error logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs
        path: |
          .buildozer/**/*.log
          *.log
        retention-days: 7
